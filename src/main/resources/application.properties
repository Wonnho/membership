spring.application.name=member

# Load local secrets from the project-root .env file when it exists.
spring.config.import=optional:file:.env[.properties]

coffee.email-verification.enabled=false
coffee.admin-password=${COFFEE_ADMIN_PASSWORD:coffeemakerAdmin}

server.port=8081
server.servlet.session.timeout=30m

# MariaDB connection
# Set DB_PASSWORD in the IntelliJ application environment.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3309/coffeemaker}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Preserve existing records while creating/updating missing tables.
spring.jpa.hibernate.ddl-auto=update

# Do not execute data.sql every time the persistent database starts.
spring.sql.init.mode=never

# SQL debugging
logging.level.org.hibernate.SQL=DEBUG
# Enable temporarily to display SQL parameter values.
# logging.level.org.hibernate.orm.jdbc.bind=TRACE

logging.level.root=INFO
logging.level.com.membership.member=DEBUG

coffee.upload-dir=uploads/coffee
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Configure these environment variables in the application run configuration.
# No verification email is sent until MAIL_HOST and MAIL_FROM are configured.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

coffee.mail.from=${MAIL_FROM:}

# Never log credentials, verification codes, or SMTP message contents.
logging.level.org.hibernate.orm.jdbc.bind=OFF
spring.mail.properties.mail.debug=false
