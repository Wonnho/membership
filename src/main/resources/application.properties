spring.application.name=member
coffee.email-verification.enabled=false
server.port=8081
server.servlet.session.timeout=30m
spring.h2.console.enabled=true

#set fix URL
spring.datasource.url=jdbc:h2:mem:member

spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true

//DEBUG
logging.level.org.hibernate.SQL=DEBUG
//logging.level.org.hibernate.orm.jdbc.bind=TRACE

logging.level.root=INFO
logging.level.com.membership.member=DEBUG

coffee.upload-dir=uploads/coffee
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Configure these environment variables in the application run configuration.
# No verification email is sent until MAIL_HOST and MAIL_FROM are configured.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
coffee.mail.from=${MAIL_FROM:}
# Never log credentials, verification codes, or SMTP message contents.
logging.level.org.hibernate.orm.jdbc.bind=OFF
spring.mail.properties.mail.debug=false
